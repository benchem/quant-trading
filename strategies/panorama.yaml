# Panorama Framework Scan / 全景推演（15框架×持仓盈亏）
# 2026-11-12 应用户要求新增：把"全部策略框架对同一标的推演一遍并结合持仓盈亏"固化为一个框架。
# 输出结构来自 2026-11-12 300687 实战推演（会话交付版）。

name: panorama
display_name: 全景推演(15框架×仓位)
description: 全部策略框架对同一标的逐个对表推演，结合用户持仓批次与盈亏，输出仓位底座+框架对表+综合裁定三段结构。
category: framework
core_rules: [1, 2, 3, 5]
required_tools:
  - get_positions
  - analyze_trend
  - get_daily_history
  - get_chip_distribution
  - get_stock_info
  - get_sector_rankings
aliases: [全景推演, 全部框架, 推演一遍, 所有策略]
default_priority: 10
market_regimes: [any]

instructions: |
  **全景推演（Panorama Framework Scan）**

  对用户指定的标的，用全部策略框架逐个对表推演，并始终结合用户真实持仓与盈亏。
  输出严格三段结构：

  ## 第一段：仓位底座（先对齐事实）

  用 `get_positions` 取该股持仓，结合 `get_daily_history` 末根收盘价，输出表格：
  - 持仓股数与批次（若工具未给批次明细，用持仓股数+成本即可，勿编造批次）
  - 成本口径（工具返回的 avg_cost 为移动加权口径，需注明）
  - 现价与浮动盈亏（元），已实现盈亏（若有）
  - 市场相对位：用 `get_chip_distribution` 的 avg_cost（全市场筹码平均成本）与 profit_ratio（获利盘比例），
    判断用户成本在市场平均成本之上/之下、上方套牢盘压力
  若该股不在持仓内，明确写"空仓观察"并跳过批次相关行。

  ## 第二段：框架对表（逐个判定）

  先用一句话给技术底座（来自 `analyze_trend`：MA5/10/20/60 数值与排列、MACD 状态、RSI、量比、
  60日位置分位、20日涨幅）。然后对每个框架输出一行表格，列：
  **框架 | 判定（对该股当前数据的对表结果） | 信号（偏多/中性/偏空/不适用） | 对仓位的含义**

  15 个框架的判定要点（每个都必须出现，不成立的写明差在哪条）：
  1. 箱体震荡：近20~60日高低点圈箱体，现价距箱底/箱顶百分比，距箱底≤5%为箱底买入区
  2. 波浪理论：最近一段推动/反弹结构，当前回调深度百分比，0.5/0.618回撤位数值
  3. 底部放量：是否处于长期下跌后底部+放量反转结构（20日涨幅、52周位置分位）
  4. 事件驱动：近期公告/订单/财报事件+未来日历催化，正面/双向标注
  5. 成长质量：营收/净利增速、ROE、净利率、负债率、市值与估值（估值字段为负或异常时注明存疑）
  6. 预期重估：YTD涨幅、预期差方向（订单→收入转化、政策）
  7. 缠论：近8~10日K线重叠区=短期中枢，现价在中枢内/上/下，有无三类买卖点
  8. 均线金叉：MA5与MA10差值及方向，MACD柱正负，金叉日量比是否>1.2
  9. 多头趋势：MA5≥MA10≥MA20且MA20向上是否成立，价格是否显著跌破MA20（乖离率）
  10. 热点题材：所属题材当前处于发酵/主升/退潮哪一阶段（用板块排行佐证）
  11. 情绪周期：市场情绪位置（大盘涨跌、强势股今日表现），恐慌底/狂热顶判定
  12. 缩量回踩：三大前提（多头排列+回踩MA5/10±1~2%+回调量<5日均量70%）逐条判
  13. 放量突破：距最近阻力位百分比、量比是否>2
  14. 一阳夹三阴：实际K线形态与该形态的匹配度（注意识别反向形态）
  15. 龙头策略：板块内相对强度、是否具备龙头基因

  数据不足的框架如实标"数据不足"，禁止编造数字。

  ## 第三段：综合裁定

  1. 多空票数统计：偏多 N / 中性观望 N / 偏空或不适用 N，一句话点评分歧结构
  2. 证伪线收敛：把各框架的支撑/止损线从小到大列出，指出收敛区
  3. 下一个观察点：均线粘合/中枢边界/箱体边界的具体数值与方向判定
  4. 与用户既定规则的关系：框架结论是叙事面与参考意见，**不构成买卖触发**——
     若用户对该股有既定交易计划（止损位/买入条件/仓位上限），以既定规则为准，框架只提供背景研判；
     框架建议与既定规则冲突时，明确指出冲突点并建议用户复核规则，而不是绕开规则给操作指令

  ## 纪律
  - 表格优先，每格短句；总长控制在 800~1200 字
  - 每个数字可溯源到工具返回；口径（FIFO/移动加权/真实价）出现两可时注明用的是哪个
  - 不给无条件买卖指令；结论用条件式（"若站上X则…，跌破Y则…"）

  评分调整：
  - 三段结构完整且数字可溯源：sentiment_score 可信度标"高"
  - 框架判定与仓位含义脱节（只谈股不谈仓）：可信度降一级
  - 在 `buy_reason` 中注明"全景推演"，多空票数写入 `risk_assessment`
